name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Angular 22 supports Node 22, 24 and 26+; 24 is the LTS used for development.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists, and fails if it is out of date.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ng test watches for changes by default; run the tests once and exit.
      - name: Test
        run: npx ng test --watch=false