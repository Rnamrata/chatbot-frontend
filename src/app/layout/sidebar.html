<nav aria-label="Main" class="sidebar">
  <div class="brand">
    <app-lens-logo [size]="40" />
    <div class="brand-text">
      <span class="brand-name">Lens</span>
      <span class="brand-tag">Ask docs. Review code.</span>
    </div>
    @if (closable()) {
      <button type="button" class="close-menu" aria-label="Close menu" (click)="closeMenu.emit()">
        <app-icon name="close" />
      </button>
    }
  </div>

  <a routerLink="/chat" class="new-chat">
    <app-icon name="plus" />
    New chat
  </a>

  <ul class="links">
    <li>
      <a routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page" class="link">
        <app-icon name="history" />
        History
      </a>
    </li>
    <li>
      <a routerLink="/sources" routerLinkActive="active" ariaCurrentWhenActive="page" class="link">
        <app-icon name="folder" />
        Sources
      </a>
    </li>
  </ul>

  <section class="recent" aria-labelledby="recent-heading">
    <h2 id="recent-heading" class="label">Recent</h2>
    @for (item of recent(); track item.id) {
      <a [routerLink]="item.link" routerLinkActive="active" ariaCurrentWhenActive="page" class="recent-item">
        <app-icon [name]="item.icon" [size]="16" [class.pin]="item.pinned" />
        <span class="recent-text">
          <span class="recent-title">{{ item.title }}</span>
          <span class="recent-when">{{ item.when }}</span>
        </span>
      </a>
    } @empty {
      <p class="recent-empty">Your chats and reviews will show up here.</p>
    }
  </section>

  <app-connection-status class="status" />
</nav>
