@if (!drawer()) {
  <a class="skip" href="#content" (click)="skipToContent($event)">Skip to content</a>
}

<div class="shell">
  @if (layout.sidebarOpen()) {
    <app-sidebar id="main-nav" class="sidebar" [class.drawer]="drawer()" [closable]="drawer()" (closeMenu)="closeDrawer()" />
    @if (drawer()) {
      <!-- Tapping beside the drawer closes it; keyboard users have Close menu and Escape. -->
      <div class="backdrop" aria-hidden="true" (click)="closeDrawer()"></div>
    }
  }

  <div class="main" [inert]="drawer()">
    <header class="topbar">
      <div class="title-group">
        <button
          #menuButton
          type="button"
          class="icon-btn"
          aria-controls="main-nav"
          [class.bare]="layout.isMobile()"
          [attr.aria-expanded]="layout.sidebarOpen()"
          [attr.aria-label]="menuLabel()"
          (click)="toggleMenu()"
        >
          <app-icon [name]="layout.isMobile() ? 'menu' : 'panel'" />
        </button>
        <div class="titles">
          <h1 #title class="title" tabindex="-1">{{ header.title() }}</h1>
          @if (header.subtitle(); as subtitle) {
            <p class="subtitle">{{ subtitle }}</p>
          }
        </div>
      </div>

      <div class="actions">
        @if (mode(); as mode) {
          <app-mode-switch [mode]="mode" [compact]="layout.isMobile()" />
        }
        <app-theme-toggle />
      </div>
    </header>

    <main #content id="content" class="page" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
