<div class="frame">
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Type</th>
        <th scope="col">Status</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      @for (s of sources(); track s.id) {
        <tr>
          <td class="name">
            <span class="title" [title]="s.name">{{ s.name }}</span>
            <span class="detail">{{ detail(s) }}</span>
          </td>
          <td class="type">{{ typeLabel(s) }}</td>
          <td>
            <span class="pill" [class]="s.status">{{ statusLabel(s) }}</span>
          </td>
          <td class="actions">
            @if (s.status !== 'processing') {
              @if (confirming() === s.id) {
                <span class="ask">
                  <button type="button" class="danger" (click)="confirm(s.id)">Remove</button>
                  <button type="button" class="plain" (click)="confirming.set(null)">Cancel</button>
                </span>
              } @else {
                <button
                  type="button"
                  class="icon"
                  [disabled]="removing() === s.id"
                  [attr.aria-label]="'Remove ' + s.name"
                  (click)="confirming.set(s.id)"
                >
                  <app-icon [name]="removing() === s.id ? 'spinner' : 'trash'" [size]="16" />
                </button>
              }
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
